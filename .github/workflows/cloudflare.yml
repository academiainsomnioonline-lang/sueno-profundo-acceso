name: Publicar en Cloudflare (app.academiaonlineinsomnio.com)
on:
  push:
    branches: [principal]
  workflow_dispatch:
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Quitar la carpeta de GitHub del paquete
        run: rm -rf .github
      - name: Publicar en Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 3ff20f4b17dccc4337be9e54ff2f04dd
          command: pages deploy . --project-name=aoi-plataforma --branch=main --commit-dirty=true
