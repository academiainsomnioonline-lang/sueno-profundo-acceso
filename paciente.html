<style>
  :root{
    --bg:#F7F1E3; --surface:#FFFDF8; --surface-2:#FBF6EA; --ink:#2A2824; --ink-soft:#4B463C;
    --muted:#8A7F6A; --line:#E7DFC9; --line-soft:#F0E9D7;
    --night:#101119; --night-2:#1E2130; --gold:#9A7A3C; --gold-bright:#D4AF37; --gold-soft:#F2E7CE;
    --ok:#3F8A66; --alert:#B2564C;
    --shadow:0 1px 2px rgba(42,40,36,.05),0 8px 26px rgba(42,40,36,.08);
    --r:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.5;font-size:15px;}
  h1,h2,h3,.serif{font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;margin:0;font-weight:600;text-wrap:balance;}
  button{font-family:inherit;cursor:pointer;}
  a{color:var(--gold);}
  .tnum{font-variant-numeric:tabular-nums;}

  /* Cabecera clara con logo */
  .top{background:linear-gradient(180deg,#FFFFFF,var(--surface-2));color:var(--ink);
    padding:16px 18px;padding-top:max(16px,env(safe-area-inset-top,0px));display:flex;align-items:center;gap:12px;
    border-bottom:1px solid rgba(154,122,60,.45);}
  .top img{width:40px;height:40px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(154,122,60,.5);}
  .top .nm{font-family:'Inter',sans-serif;font-weight:600;font-size:14.5px;line-height:1.1;color:var(--ink);}
  .top .sb{font-family:'Cormorant Garamond',serif;font-size:13px;color:var(--gold);}

  .wrap{max-width:600px;margin:0 auto;padding:20px 16px 48px;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}

  /* Acceso */
  .center{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;}
  .lead{font-family:'Cormorant Garamond',serif;font-size:26px;letter-spacing:-.2px;margin-bottom:4px;}
  .muted{color:var(--muted);font-size:13.5px;}
  input[type=email],input[type=password]{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:var(--surface);color:var(--ink);margin:8px 0 6px;}
  input[type=email]:focus,input[type=password]:focus{outline:2px solid var(--gold-bright);outline-offset:1px;border-color:transparent;}
  .lnk{font-size:12.5px;color:var(--gold);text-decoration:none;cursor:pointer;}
  .lnkrow{display:flex;justify-content:space-between;gap:12px;margin-top:12px;flex-wrap:wrap;}
  .btn{display:inline-block;background:var(--ink);color:#F4ECD8;border:0;border-radius:12px;padding:13px 20px;font-size:15px;font-weight:600;text-decoration:none;}
  .btn.gold{background:linear-gradient(180deg,var(--gold-bright),var(--gold));color:#2a2012;}
  .btn.block{display:block;width:100%;text-align:center;}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
  .note{font-size:12px;color:var(--muted);margin-top:10px;}
  .msg{font-size:13.5px;margin-top:10px;min-height:18px;}
  .msg.ok{color:var(--ok);} .msg.err{color:var(--alert);}

  /* Secciones */
  .hello{font-family:'Cormorant Garamond',serif;font-size:27px;letter-spacing:-.3px;margin:4px 0 2px;}
  .hello .em{font-style:normal;color:var(--gold);}
  .nuevos{display:inline-flex;align-items:center;gap:7px;background:var(--gold-soft);color:var(--gold);
    border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600;margin:6px 0 2px;}
  .sec{margin-top:26px;}
  .sec-h{display:flex;align-items:baseline;gap:9px;margin-bottom:12px;}
  .sec-h h2{font-size:19px;}
  .sec-h .c{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 9px;}
  .item{display:flex;align-items:center;gap:13px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);
    border-radius:14px;padding:13px 15px;box-shadow:var(--shadow);margin-bottom:10px;}
  .item:hover{border-color:var(--gold-bright);}
  .item .ic{width:40px;height:40px;border-radius:11px;flex:none;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold);}
  .item .tx{min-width:0;flex:1;}
  .item .tx b{font-size:14.5px;font-weight:600;display:block;}
  .item .tx span{font-size:12.5px;color:var(--muted);}
  .item .dot{width:8px;height:8px;border-radius:50%;background:var(--gold-bright);flex:none;}
  .item .chev{color:var(--muted);flex:none;}
  .empty{color:var(--muted);font-size:13.5px;padding:8px 2px;}

  /* Evolución */
  .evo-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px;}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;box-shadow:var(--shadow);}
  .stat .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600;}
  .stat .v{font-family:'Cormorant Garamond',serif;font-size:25px;font-weight:600;margin-top:5px;line-height:1;}
  .stat .v small{font-size:13px;color:var(--muted);}
  .stat .d{font-size:11.5px;margin-top:5px;font-weight:600;}
  .up{color:var(--ok);} .down{color:var(--alert);}
  .chartbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:15px;margin-bottom:12px;}
  .chartbox h3{font-size:14px;margin-bottom:2px;}
  .chartbox .sub{font-size:11.5px;color:var(--muted);margin-bottom:10px;}
  .chartbox svg{width:100%;height:120px;display:block;}
  .legr{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:3px;}

  /* Vídeo */
  .vfacade{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:16/9;cursor:pointer;border:1px solid var(--line);margin-bottom:10px;}
  .vfacade .play{position:absolute;inset:0;display:grid;place-items:center;}
  .vfacade .play span{width:60px;height:60px;border-radius:50%;background:rgba(201,161,74,.92);display:grid;place-items:center;}
  .vfacade .cap{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;color:#fff;font-size:13px;font-weight:600;
    background:linear-gradient(0deg,rgba(0,0,0,.65),transparent);}
  .vframe{aspect-ratio:16/9;border-radius:14px;overflow:hidden;border:1px solid var(--line);margin-bottom:10px;}
  .vframe iframe{width:100%;height:100%;border:0;display:block;}

  footer{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:12.5px;}
  footer a{color:var(--gold);} footer .row{margin-bottom:8px;}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--night);color:#F4ECD8;
    padding:11px 16px;border-radius:12px;font-size:13.5px;box-shadow:var(--shadow);opacity:0;transition:.2s;pointer-events:none;z-index:50;}
  .toast.show{opacity:1;}

  /* Diario, cuestionarios y firmas (20-oct-2026) */
  .task{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;}
  .task.done{border-color:rgba(63,138,102,.35);}
  .task-t{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:600;line-height:1.2;}
  .task-s{font-size:13px;color:var(--muted);margin:3px 0 12px;}
  .ndots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px;}
  .ndot{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:11px;text-transform:uppercase;}
  .ndot i{font-style:normal;height:16px;font-size:13px;color:var(--ok);font-weight:700;}
  .ndot.ok{background:#E9F3EC;border-color:rgba(63,138,102,.35);color:var(--ok);}
  .sheet{position:fixed;inset:0;background:rgba(42,40,36,.38);z-index:60;display:flex;align-items:flex-end;justify-content:center;}
  @media(min-width:640px){.sheet{align-items:center;}}
  .sheet-in{position:relative;background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 30px rgba(0,0,0,.12);}
  @media(min-width:640px){.sheet-in{border-radius:20px;}}
  .sheet-x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);font-size:15px;}
  .sheet-h{font-family:'Cormorant Garamond',serif;font-size:25px;font-weight:600;padding-right:40px;line-height:1.15;}
  .sheet-s{font-size:12.5px;color:var(--gold);font-weight:600;margin:2px 0 12px;}
  .sheet-n{font-size:14px;color:var(--ink-soft);margin:6px 0 14px;}
  .dguia{border:1px solid var(--line);border-radius:12px;background:var(--surface,#fff);margin:0 0 16px;}
  .dguia summary{cursor:pointer;list-style:none;padding:12px 14px;font-weight:600;font-size:14px;color:var(--gold,#9A7A3C);display:flex;justify-content:space-between;align-items:center;}
  .dguia summary::-webkit-details-marker{display:none;}
  .dguia summary::after{content:'+';font-size:18px;font-weight:400;}
  .dguia[open] summary::after{content:'–';}
  .dguia .in{padding:0 14px 12px;font-size:13.5px;line-height:1.55;color:var(--ink);}
  .dguia .in p{margin:0 0 8px;} .dguia .in ul{margin:0 0 8px;padding-left:18px;} .dguia .in li{margin:0 0 5px;}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:4px;}
  .chip{flex:none;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 12px;font-size:13px;color:var(--ink);white-space:nowrap;}
  .chip.ok{color:var(--ok);} .chip.on{background:var(--ink);color:#F4ECD8;border-color:var(--ink);}
  .fld{margin-bottom:14px;}
  .fld label{display:block;font-weight:600;font-size:14px;}
  .fld .req{color:var(--alert);}
  .fld .hint{font-size:12px;color:var(--muted);margin-top:2px;}
  .fld input,.step input[type=text]{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:#fff;color:var(--ink);margin-top:6px;font-family:inherit;}
  .fld input:focus,.step input:focus{outline:2px solid var(--gold-bright);outline-offset:1px;border-color:transparent;}
  .qq{border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px;background:var(--surface-2);}
  .qq.ans{background:var(--surface);}
  .qt{font-size:14.5px;font-weight:600;display:flex;gap:9px;margin-bottom:10px;line-height:1.35;}
  .qt span{flex:none;width:22px;height:22px;border-radius:50%;background:var(--gold-soft);color:var(--gold);font-size:12px;display:grid;place-items:center;}
  .opts{display:flex;flex-direction:column;gap:6px;}
  .opts.row{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;}
  .opt{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font-size:14px;text-align:left;color:var(--ink);}
  .opts.row .opt{padding:9px 0;text-align:center;font-size:13px;}
  .opt.on{background:var(--ink);color:#F4ECD8;border-color:var(--ink);}
  .optlegend{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px;}
  .step{display:flex;gap:12px;align-items:flex-start;margin-bottom:16px;font-size:14.5px;}
  .step>b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;font-size:13px;}
  .step .opts{flex-direction:row;} .step .opt{flex:1;text-align:center;}
  .chk{display:flex;gap:9px;align-items:center;font-size:14px;margin:4px 0 6px;}
  .chk input{width:18px;height:18px;}
  [hidden]{display:none!important;}
</style>
